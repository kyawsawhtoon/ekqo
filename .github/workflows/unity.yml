# Unity EditMode tests (Ekqo.Core) and the Web build, with GameCI.
# Needs repository secrets UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD, and the
# generated game/ProjectSettings (see game/README.md). Manual until both exist.
name: Unity

on:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile && pnpm content:build
      - run: mkdir -p game/Assets/StreamingAssets/content && cp -r build/content/* game/Assets/StreamingAssets/content/
      - uses: game-ci/unity-test-runner@v4
        with:
          projectPath: game
          testMode: editmode
      - uses: game-ci/unity-builder@v4
        with:
          projectPath: game
          targetPlatform: WebGL
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/WebGL
