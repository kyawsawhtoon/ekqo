# Q4. Meet the Family (Chapter 1 finale). Storyboard 10.2.
schema: ekqo.quest/1
id: q04
chapter: ch1
title: "Meet the Family"
location: house.living_room
characters: [ekqo, grandma, grandpa, parent]
function: "Introducing people; asking and saying how you are"
topics: [family.mother, family.father, family.grandma, family.grandpa, family.family, phrase.how_are_you, phrase.im_fine, feel.sleepy, thing.bed, phrase.good_night]
patterns: [pat.this_is]
