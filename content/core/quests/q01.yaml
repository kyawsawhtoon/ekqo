# Q1. A Light in the Garden. Storyboard 10.2.
schema: ekqo.quest/1
id: q01
chapter: ch1
title: "A Light in the Garden"
location: house.garden
time_of_day: night
characters: [ekqo]
function: "Greeting; saying your name; yes and no"
topics: [greet.hello, word.name, q.who, ans.yes, ans.no, nature.light, sky.star, time.night, place.garden, phrase.dont_be_scared, phrase.come_to_my_house, phrase.sleep_there]
patterns: [pat.my_name_is, pat.whats_your_name]
listening_weight: heavy          # Q1-Q3 lean on hear/show/echo with short answers
reuses: []
discoveries: [ekqo.name]
ekqo: { stage_on_start: 1, abilities: [word_book, hint_glow] }
rewards: [glow_jar]
steps:
  # Kyaw's playtest (21 Nov): each word is taught right before the moment that needs it,
  # yes and no come from Ekqo's own questions, and bedtime is taking Ekqo home, not bye.
  - { id: light_falls,  type: scene, meaning: "First night of the visit. A light falls into Grandma's garden." }
  - { id: whisper_hello, type: line, speaker: ekqo, meaning: "(from under the bushes, very quietly) Hello...", concepts: [greet.hello] }
  - { id: who,          type: line, speaker: ekqo, meaning: "Who is it?", concepts: [q.who] }
  - { id: teach_hello,  type: teach, concepts: [greet.hello] }
  - id: say_hello
    type: say
    speaker: ekqo
    meaning: "Ekqo waits for the child to say hello back."
    expects: { intent: "greets Ekqo", concepts: [greet.hello] }
    ai: { npc_vary: false, judge: meaning }
    on_success: { effect: ekqo_glow_up }
  - { id: ekqo_name,    type: line, speaker: ekqo, meaning: "My name is Ekqo.", pattern: pat.my_name_is, fill: { x: "{ekqo}" } }
  - { id: discover_name, type: discover, discovery: ekqo.name }
  - { id: ask_name,     type: line, speaker: ekqo, meaning: "What is your name?", pattern: pat.whats_your_name }
  - id: teach_name
    type: teach
    concepts: [word.name]
    patterns: [pat.my_name_is]
  - id: say_name
    type: say
    speaker: ekqo
    meaning: "The child says their name."
    expects: { intent: "says their own name", pattern: pat.my_name_is, slot_values: { x: "{player_name}" } }
    ai: { npc_vary: true, judge: meaning }
  - { id: dont_be_scared, type: line, speaker: ekqo, meaning: "Don't be scared.", concepts: [phrase.dont_be_scared] }
  - id: say_scared
    type: say
    speaker: ekqo
    meaning: "Ekqo asks: are you scared? The child says they are scared, or not."
    expects: { intent: "says whether they are scared", any_of: [ans.yes, ans.no] }
    ai: { npc_vary: false, judge: meaning }
  - { id: fell_from_sky, type: line, speaker: ekqo, meaning: "(very sleepily) I fell... from the sky. From the stars.", concepts: [sky.star, nature.light] }
  - { id: teach_no,     type: teach, concepts: [ans.no] }
  - id: say_not_star
    type: say
    speaker: ekqo
    meaning: "Ekqo asks: are you a star too? The child says no."
    expects: { intent: "says no, they are not a star", concepts: [ans.no] }
    ai: { npc_vary: false, judge: meaning }
  - { id: teach_yes,    type: teach, concepts: [ans.yes] }
  - id: say_your_garden
    type: say
    speaker: ekqo
    meaning: "Ekqo asks: is this your garden? The child says yes."
    expects: { intent: "says yes", concepts: [ans.yes] }
    ai: { npc_vary: false, judge: meaning }
  - { id: word_book,    type: reward, items: [], abilities: [word_book], meaning: "The child gets the word book." }
  - { id: sleepy,       type: line, speaker: ekqo, meaning: "(yawning) I'm sleepy..." }
  - { id: teach_home,   type: teach, concepts: [phrase.come_to_my_house, phrase.sleep_there] }
  - id: say_come_home
    type: say
    speaker: ekqo
    meaning: "The child tells sleepy Ekqo to come to their house."
    expects: { intent: "asks Ekqo to come home with them", concepts: [phrase.come_to_my_house] }
    ai: { npc_vary: false, judge: meaning }
  - id: say_sleep_there
    type: say
    speaker: ekqo
    meaning: "The child tells Ekqo he can sleep there."
    expects: { intent: "tells Ekqo he can sleep there", concepts: [phrase.sleep_there] }
    ai: { npc_vary: false, judge: meaning }
  - { id: review,       type: review }
  - { id: reward,       type: reward, items: [glow_jar] }
