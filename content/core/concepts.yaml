# Sentence patterns are communicative functions. Every edition implements each
# pattern a quest names; the edition decides the words and word order.
patterns:
  - { id: pat.my_name_is,     meaning: "My name is ___",            slots: { x: player_name } }
  - { id: pat.whats_your_name, meaning: "What is your name?",        slots: {} }
  - { id: pat.want_to_eat,    meaning: "I want to eat ___",         slots: { x: "kind:noun care:feed" } }
  - { id: pat.want_to_drink,  meaning: "I want to drink ___",       slots: { x: "prefix:drink." } }
  - { id: pat.want_to_eat_q,  meaning: "Do you want to eat ___?",   slots: { x: "kind:noun care:feed" } }
  - { id: pat.lets_wash,      meaning: "Let's wash ___",            slots: { x: "prefix:body." } }
  - { id: pat.this_is,        meaning: "This is ___",               slots: { x: "prefix:family." } }
  - { id: pat.where_is,       meaning: "Where is ___?",             slots: { x: "prefix:place." } }
  - { id: pat.lets_together,  meaning: "Let's ___ together",        slots: { x: "kind:verb care:play" } }
  - { id: pat.please_give_n,  meaning: "Please give me [number] [thing]", slots: { thing: "kind:noun", n: "prefix:num." } }
  - { id: pat.how_many_q,     meaning: "How many?",                 slots: {} }
  - { id: pat.ill_have,       meaning: "I'll have ___",             slots: { x: "kind:noun care:feed" } }
  - { id: pat.what_would_you_like, meaning: "What would you like?", slots: {} }
  - { id: pat.colored,        meaning: "It's ___ (color)",          slots: { x: "kind:color" } }
  - { id: pat.what_color,     meaning: "What color is this?",       slots: {} }
  - { id: pat.how_much,       meaning: "How much is ___?",          slots: { x: "prefix:fruit." } }
  - { id: pat.do_you_like,    meaning: "Do you like ___?",          slots: { x: any } }
  - { id: pat.i_like,         meaning: "I like ___",                slots: { x: any } }
  - { id: pat.i_dont_like,    meaning: "I don't like ___",          slots: { x: any } }
  - { id: pat.are_you_feeling, meaning: "Are you ___? (feeling)",   slots: { x: "prefix:feel." } }
